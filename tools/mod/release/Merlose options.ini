; Two's A Riot - options
; Open this file in Notepad, change "yes" to "no" for anything you don't want,
; save it, then run "Patch Vagrant Story.bat".
; Merlose herself is always included.

[features]

; Permanent stat-up items (the ones that raise STR, INT, AGL, max HP or max MP for good)
; always give the most they can, +4, instead of a random +1 to +4.
max_stat_items = yes

; After a boss, choose your bonus wheel reward instead of spinning for it:
; Down/Up to pick, Circle to take it.
; This is left out automatically if your disc has the QoL mod's default
; (Cross confirms) version, which changes the same screen.
choosable_bonus_wheel = yes
